[workspace]
resolver = "2"
members = ["core", "cli", "src-tauri"]

[workspace.package]
version  = "0.1.0"
edition  = "2021"
authors  = ["tawhetsell"]
license  = "MIT"

[workspace.dependencies]
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
walkdir     = "2.5"
regex       = "1.11"
anyhow      = "1.0"
once_cell   = "1.20"
