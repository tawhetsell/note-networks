[package]
name        = "note-graph-cli"
description = "CLI that builds a note-network graph from a corpus directory"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true

[[bin]]
name = "note-graph"
path = "src/main.rs"

[dependencies]
note-graph-core = { path = "../core" }
clap            = { version = "4.5", features = ["derive"] }
anyhow          = { workspace = true }
serde_json      = { workspace = true }
