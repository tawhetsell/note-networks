<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note Graph — Meditations</title>

<!--
  Fruchterman–Reingold force layout via d3 v7.

  The algorithm is named for Fruchterman & Reingold (1991).
  In d3's vocabulary the same physics appears as:
    - d3.forceManyBody()  = node-node repulsion (like-charges pushing apart)
    - d3.forceLink()      = spring forces along edges (connected nodes attract)
    - d3.forceCenter()    = weak gravity pulling all nodes toward canvas center

  Gephi calls these "Repulsion strength", "Optimal distance", and "Gravity".
  Different vocabulary; same numerical model.
-->

<!--
  d3 is vendored (a pinned copy kept in the repo) rather than loaded from a CDN:
  a CDN file can change under you, and in the desktop app any script on this page
  can call the note read/edit/delete commands.  Same path works under watch.py
  (/viz/vendor/…) and Tauri (frontendDist = viz/).  To upgrade, replace the file
  with the new version's dist/d3.min.js from the npm package.
-->
<script src="vendor/d3-7.9.0.min.js"></script>

<style>
  /* ---- BASE / DARK MODE ---- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f0f12;
    --surface:   #1a1a22;
    --border:    #2e2e3e;
    --text:      #d0d0e0;
    --muted:     #6a6a8a;
    --accent:    #7a7fff;
    --edge:      #3a3a5a;
    --edge-hi:   #9090ff;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px; overflow: hidden;
  }

  /* ---- LAYOUT ---- */
  #app { display: flex; width: 100%; height: 100vh; }

  #canvas-wrap {
    flex: 1; position: relative; overflow: hidden;
  }

  svg#graph {
    width: 100%; height: 100%;
    background: var(--bg);
  }

  /* ---- LEFT PANEL ---- */
  #left-panel {
    width: 240px; min-width: 240px;
    display: flex; flex-direction: column;
    background: var(--surface); border-right: 1px solid var(--border);
    overflow: hidden;
  }

  /* ---- CONTROLS (in left panel, no longer absolute) ---- */
  #controls {
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px; flex-shrink: 0;
  }

  #search {
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 6px 10px; border-radius: 6px;
    width: 100%; outline: none; font-size: 13px;
  }
  #search:focus { border-color: var(--accent); }

  /* ---- FR SLIDERS (collapsible) ---- */
  #fr-panel {
    background: none; border: none;
    padding: 0; width: 100%;
  }
  #fr-panel summary {
    cursor: pointer; font-size: 12px; color: var(--muted);
    user-select: none; list-style: none;
  }
  #fr-panel summary::-webkit-details-marker { display: none; }
  #fr-panel summary::before { content: "▸ "; }
  #fr-panel[open] summary::before { content: "▾ "; }

  .slider-row {
    display: flex; flex-direction: column; gap: 3px;
    margin-top: 8px; font-size: 12px; color: var(--muted);
  }
  .slider-header {
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .slider-header label { }
  .slider-header span  { color: var(--text); font-variant-numeric: tabular-nums; }
  .slider-row input[type=range] { width: 100%; accent-color: var(--accent); }

  #reset-btn {
    margin-top: 8px; width: 100%; padding: 4px 0;
    background: none; border: 1px solid var(--border);
    color: var(--muted); border-radius: 4px; cursor: pointer;
    font-size: 12px;
  }
  #reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  #layout-row {
    display: flex; align-items: center; gap: 8px;
  }
  #layout-row label {
    font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  #layout-select {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 4px 6px; border-radius: 4px;
    font-size: 12px; cursor: pointer; outline: none;
  }
  #layout-select:focus { border-color: var(--accent); }

  /* ---- BOTTOM CONTROLS ---- */
  #bottom-controls {
    flex-shrink: 0; border-top: 1px solid var(--border);
    padding: 10px; display: flex; flex-direction: column; gap: 6px;
  }

  #reload-row {
    display: flex; align-items: center; gap: 8px;
  }
  #reload-btn, #center-btn {
    padding: 5px 10px; background: none;
    border: 1px solid var(--border); color: var(--muted);
    border-radius: 4px; cursor: pointer; font-size: 12px;
    white-space: nowrap;
  }
  #reload-btn:hover, #center-btn:hover { border-color: var(--accent); color: var(--accent); }
  #reload-btn.spinning { animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- LINK METHOD ---- */
  #link-method-row {
    display: flex; align-items: center; gap: 8px;
  }
  #link-method-row > label {
    font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  #link-method-btns {
    display: flex; flex: 1;
  }
  .link-method-btn {
    flex: 1; padding: 4px 0;
    background: none; border: 1px solid var(--border);
    color: var(--muted); cursor: pointer; font-size: 11px;
    margin-left: -1px; transition: border-color 0.15s, color 0.15s;
  }
  .link-method-btn:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  .link-method-btn:last-child  { border-radius: 0 4px 4px 0; }
  .link-method-btn:hover { border-color: var(--accent); color: var(--accent); position: relative; z-index: 1; }
  .link-method-btn.active {
    border-color: var(--accent); color: var(--accent);
    background: rgba(122,127,255,0.12); position: relative; z-index: 1;
  }

  /* ---- DENSITY FILTER ---- */
  #density-row {
    display: flex; align-items: center; gap: 8px;
  }
  #density-row > label {
    font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  #density-btns {
    display: flex; flex: 1;
  }
  .density-btn {
    flex: 1; padding: 4px 0;
    background: none; border: 1px solid var(--border);
    color: var(--muted); cursor: pointer; font-size: 11px;
    margin-left: -1px; transition: border-color 0.15s, color 0.15s;
  }
  .density-btn:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  .density-btn:last-child  { border-radius: 0 4px 4px 0; }
  .density-btn:hover { border-color: var(--accent); color: var(--accent); position: relative; z-index: 1; }
  .density-btn.active {
    border-color: var(--accent); color: var(--accent);
    background: rgba(122,127,255,0.12); position: relative; z-index: 1;
  }
  #density-count {
    font-size: 11px; color: var(--muted); white-space: nowrap; min-width: 48px;
  }

  #reload-status {
    font-size: 11px; color: var(--muted);
  }

  /* ---- NOTE LIST ---- */
  #note-list {
    flex: 1; overflow-y: auto;
    border-top: 1px solid var(--border);
  }
  #note-list::-webkit-scrollbar { width: 5px; }
  #note-list::-webkit-scrollbar-track { background: transparent; }
  #note-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  #note-list::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  #note-list-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 10px; font-size: 11px; color: var(--muted);
    letter-spacing: 0.04em; text-transform: uppercase;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #sort-controls {
    display: flex; align-items: center; gap: 3px;
  }
  #sort-select {
    background: var(--bg); border: 1px solid var(--border);
    color: var(--muted); padding: 2px 4px; border-radius: 3px;
    font-size: 10px; cursor: pointer; outline: none;
    text-transform: none; letter-spacing: 0;
  }
  #sort-select:focus, #sort-select:hover { border-color: var(--accent); color: var(--accent); }
  #sort-dir {
    background: none; border: 1px solid var(--border);
    color: var(--muted); padding: 1px 5px; border-radius: 3px;
    font-size: 11px; cursor: pointer; line-height: 1.5;
    text-transform: none; letter-spacing: 0;
  }
  #sort-dir:hover { border-color: var(--accent); color: var(--accent); }

  .note-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.1s;
    user-select: none;
  }
  .note-item:hover { background: rgba(255,255,255,0.04); }
  .note-item.active {
    background: rgba(122,127,255,0.1);
    border-left-color: var(--accent);
  }
  .note-item-dot {
    width: 7px; height: 7px;
    border-radius: 50%; flex-shrink: 0;
  }
  .note-item-label {
    flex: 1; font-size: 12px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---- EDGE TOOLTIP ---- */
  #tooltip {
    position: fixed; pointer-events: none;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; font-size: 12px;
    max-width: 260px; line-height: 1.5;
    display: none; z-index: 30;
  }

  /* ---- SIDE PANEL (note detail) ---- */
  #side-panel {
    width: 320px; min-width: 260px;
    background: var(--surface); border-left: 1px solid var(--border);
    padding: 16px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    transition: width 0.2s;
  }
  #side-panel.hidden { width: 0; min-width: 0; padding: 0; overflow: hidden; }

  #panel-close {
    align-self: flex-end; background: none; border: none;
    color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1;
  }
  #panel-close:hover { color: var(--text); }

  #panel-meta {
    font-size: 12px; color: var(--muted); line-height: 1.7;
    border-bottom: 1px solid var(--border); padding-bottom: 10px;
  }
  #panel-meta strong { color: var(--text); }

  #panel-body {
    font-size: 13px; line-height: 1.7; color: var(--text);
    white-space: pre-wrap;
  }

  #panel-error { font-size: 12px; color: #f06060; }

  /* ---- WRITE CONTROLS ---- */
  #create-note-btn {
    display: none;   /* revealed by detectWriteServer() when /api/ping responds */
    margin: 8px 10px 8px;
    width: calc(100% - 20px);
    padding: 6px 0;
    background: rgba(122,127,255,0.1); border: 1px solid var(--accent);
    color: var(--accent); border-radius: 4px;
    cursor: pointer; font-size: 12px;
  }
  #create-note-btn:hover { background: rgba(122,127,255,0.2); }

  #panel-top-row {
    display: flex; align-items: center; justify-content: space-between;
  }
  #edit-note-btn {
    display: none;   /* shown when canEdit=true and a note is open */
    background: rgba(122,127,255,0.1); border: 1px solid var(--accent);
    color: var(--accent); font-size: 13px;
    padding: 6px 16px; border-radius: 4px; cursor: pointer;
  }
  #edit-note-btn:hover { background: rgba(122,127,255,0.2); }

  /* Write / edit form */
  #write-view { display: flex; flex-direction: column; gap: 10px; }
  #write-view.hidden { display: none; }
  #read-view.hidden  { display: none; }

  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field label { font-size: 11px; color: var(--muted); }
  .form-field input, .form-field textarea {
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px;
    padding: 6px 8px; font-size: 12px; font-family: inherit;
    resize: vertical;
  }
  .form-field input:focus, .form-field textarea:focus {
    outline: none; border-color: var(--accent);
  }
  #create-fields.hidden { display: none; }
  #form-actions { display: flex; gap: 8px; }
  #save-btn {
    flex: 1; padding: 6px 0;
    background: var(--accent); border: none;
    color: #fff; border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  #save-btn:hover { opacity: 0.85; }
  #cancel-btn {
    padding: 6px 12px; background: none;
    border: 1px solid var(--border); color: var(--muted);
    border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  #cancel-btn:hover { border-color: var(--accent); color: var(--accent); }
  #delete-row { margin-top: 4px; }
  #delete-row.hidden { display: none; }
  #delete-btn {
    width: 100%; padding: 6px 0;
    background: none; border: 1px solid #b04040;
    color: #c06060; border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  #delete-btn:hover { background: rgba(176,64,64,0.2); border-color: #d06060; color: #d88; }
  #form-status { font-size: 11px; color: var(--muted); min-height: 16px; }

  /* ---- FILE:// WARNING ---- */
  #file-warning {
    position: absolute; bottom: 10px; left: 12px; z-index: 20;
    background: #2a1a10; border: 1px solid #6a3a10;
    border-radius: 6px; padding: 8px 12px; font-size: 12px;
    max-width: 340px; display: none;
  }
  #file-warning a { color: var(--accent); }

  /* ---- SVG ELEMENTS ---- */
  .node circle {
    stroke-width: 1.5px; cursor: grab; transition: opacity 0.15s;
  }
  .node circle:active { cursor: grabbing; }
  .node.dimmed circle { opacity: 0.2; }
  .node.highlighted circle { stroke: #fff !important; stroke-width: 2.5px; }

  .node text {
    font-size: 10px; fill: var(--text); pointer-events: none;
    text-anchor: middle; dominant-baseline: central;
    paint-order: stroke;
    stroke: var(--bg); stroke-width: 3px;
  }

  .link {
    stroke: var(--edge); stroke-linecap: round;
    transition: stroke 0.15s, opacity 0.15s;
    cursor: pointer;
  }
  .link.dimmed { opacity: 0.08; }
  .link.highlighted { stroke: var(--edge-hi) !important; }
</style>
</head>
<body>

<div id="app">
  <!-- ---- LEFT PANEL: controls + note list ---- -->
  <div id="left-panel">
    <div id="controls">
      <input id="search" type="search" placeholder="Search nodes…" autocomplete="off">
    </div>

    <!-- Create Note button — hidden in read-only / demo mode -->
    <button id="create-note-btn" title="Create a new note">+ New Note</button>

    <!-- Scrollable note list — populated by buildNoteList() -->
    <div id="note-list">
      <div id="note-list-header">
        <span id="note-list-count">Notes</span>
        <div id="sort-controls">
          <select id="sort-select" title="Sort order">
            <option value="chron">Chron</option>
            <option value="title">Title</option>
            <option value="links">Links</option>
          </select>
          <button id="sort-dir" title="Toggle ascending / descending">↑</button>
        </div>
      </div>
    </div>

    <!-- Bottom controls: layout, FR params, density, actions -->
    <div id="bottom-controls">
      <div id="layout-row">
        <label for="layout-select">Layout</label>
        <select id="layout-select">
          <optgroup label="Physics">
            <option value="force">Force (FR)</option>
            <option value="force-atlas">Force Atlas</option>
            <option value="kk">Kamada-Kawai</option>
          </optgroup>
          <optgroup label="Geometric">
            <option value="circular" selected>Circular</option>
            <option value="concentric">Concentric</option>
            <option value="radial">Radial</option>
            <option value="clustered">Clustered</option>
            <option value="grid">Grid</option>
            <option value="spectral">Spectral</option>
            <option value="spiral">Spiral</option>
            <option value="linear">Linear</option>
            <option value="random">Random</option>
          </optgroup>
        </select>
      </div>

      <details id="fr-panel">
        <summary>FR parameters — Force &amp; Atlas</summary>

        <div class="slider-row">
          <div class="slider-header">
            <label>Repulsion</label><span id="lbl-repulsion">300</span>
          </div>
          <input type="range" id="sl-repulsion" min="10" max="3000" step="10" value="300">
        </div>

        <div class="slider-row">
          <div class="slider-header">
            <label>Gravity</label><span id="lbl-gravity">0.05</span>
          </div>
          <input type="range" id="sl-gravity" min="0" max="0.30" step="0.01" value="0.05">
        </div>

        <button id="reset-btn">Reset defaults</button>
      </details>

      <!-- Link generation method -->
      <div id="link-method-row">
        <label>Links</label>
        <div id="link-method-btns">
          <button class="link-method-btn active" data-method="tfidf">TF-IDF</button>
          <button class="link-method-btn" data-method="tags">Tags</button>
        </div>
      </div>

      <!-- Edge density filter -->
      <div id="density-row">
        <label>Density</label>
        <div id="density-btns">
          <button class="density-btn active" data-min="1">All</button>
          <button class="density-btn" data-min="2">≥2</button>
          <button class="density-btn" data-min="3">≥3</button>
          <button class="density-btn" data-min="4">≥4</button>
        </div>
        <span id="density-count"></span>
      </div>

      <div id="reload-row">
        <button id="reload-btn" title="Re-fetch graph.json and re-render">↺ Reload</button>
        <button id="center-btn" title="Fit graph to view">⊕ Center</button>
        <span id="reload-status"></span>
      </div>
    </div>
  </div>

  <!-- ---- GRAPH CANVAS ---- -->
  <div id="canvas-wrap">
    <svg id="graph"></svg>

    <!-- Edge hover tooltip -->
    <div id="tooltip"></div>

    <!-- file:// fetch warning (shown dynamically) -->
    <div id="file-warning">
      ⚠ <strong>file:// detected.</strong> Click a node to read its .md body
      requires a local server.<br>
      Run: <code>python -m http.server 8765</code> from repo root, then open
      <a href="http://localhost:8765/viz/graph.html">localhost:8765/viz/graph.html</a>.
    </div>
  </div>

  <!-- ---- NOTE SIDE PANEL ---- -->
  <div id="side-panel" class="hidden">
    <div id="panel-top-row">
      <button id="edit-note-btn" title="Edit this note">Edit</button>
      <button id="panel-close" title="Close">×</button>
    </div>
    <!-- Read view: metadata + body -->
    <div id="read-view">
      <div id="panel-meta"></div>
      <div id="panel-body"></div>
      <div id="panel-error"></div>
    </div>
    <!-- Write view: edit / create form -->
    <div id="write-view" class="hidden">
      <form id="note-form">
        <div id="create-fields" class="hidden">
          <div class="form-field">
            <label>Note ID</label>
            <input id="form-id" type="text" placeholder="e.g. my-note-001" autocomplete="off">
          </div>
        </div>
        <div class="form-field">
          <label>Tags (comma-separated)</label>
          <input id="form-tags" type="text" placeholder="e.g. virtue, reason" autocomplete="off">
        </div>
        <div class="form-field">
          <label>Body</label>
          <textarea id="form-body" rows="14"></textarea>
        </div>
        <div id="form-actions">
          <button type="submit" id="save-btn">Save</button>
          <button type="button" id="cancel-btn">Cancel</button>
        </div>
        <div id="delete-row" class="hidden">
          <button type="button" id="delete-btn">Delete note</button>
        </div>
        <div id="form-status"></div>
      </form>
    </div>
  </div>
</div>

<!--
  NOTE (V1 behaviour):
  If you replace the demo corpus with personal notes, graph.json and the .md
  files expose note titles and keyword pairs in plain text. Keep data/ out of
  version control (it is gitignored by default) and do not publish the viewer
  pointing at private content without authentication.
-->

<script type="module">
"use strict";

// ---- Surface uncaught JS errors as a visible banner (otherwise they vanish silently in the webview) ----
window.addEventListener("error", (e) => _showError(`JS error: ${e.message} @ ${e.filename}:${e.lineno}`));
window.addEventListener("unhandledrejection", (e) => _showError(`Promise rejection: ${e.reason && (e.reason.message || e.reason)}`));
function _showError(msg) {
  let b = document.getElementById("debug-banner");
  if (!b) {
    b = document.createElement("div");
    b.id = "debug-banner";
    b.style.cssText =
      "position:fixed;top:0;left:0;right:0;z-index:9999;background:#702020;color:#fff;padding:8px 12px;font:12px monospace;white-space:pre-wrap;max-height:40vh;overflow:auto;";
    (document.body || document.documentElement).appendChild(b);
  }
  b.textContent += "\n" + msg;
}

// Fixed simulation constants — not exposed as sliders
const LINK_DIST      = 90;    // forceLink rest length
const VELOCITY_DECAY = 0.4;   // simulation damping
const SIM_RUN_MS     = 4000;  // physics layouts auto-stop after this many ms
let   simTimer       = null;  // handle for the auto-stop timeout

// runSimFor: start (or restart) the simulation and stop it after `ms` milliseconds.
// Clears any existing timer so rapid re-triggers don't stack.
function runSimFor(ms) {
  if (simTimer) clearTimeout(simTimer);
  simulation.restart();
  simTimer = setTimeout(() => { simulation.stop(); simTimer = null; }, ms);
}

// stopSim: cancel the timer and stop immediately (used when user selects a note).
function stopSim() {
  if (simTimer) { clearTimeout(simTimer); simTimer = null; }
  simulation?.stop();
}

// ---- DEFAULTS (also used by reset button) ----
const DEFAULTS = {
  repulsion: 300,   // forceManyBody magnitude (positive; applied negative); higher = spread
  gravity:   0.05,  // forceRadial strength toward center; 0 = free drift, 0.2 = strong pull
};

// ---- PALETTE ----
// d3.schemeTableau10: 10 visually distinct categorical colours
const color = d3.scaleOrdinal(d3.schemeTableau10);

// ---- STATE ----
let simulation, linkSel, nodeSel, currentParams = { ...DEFAULTS };
let currentLinks   = [];      // edge objects with resolved source/target; needed by KK layout
let currentLayout  = "circular"; // tracks active layout so reload can re-apply it
let allData        = null;    // raw graph.json — kept so density filter can re-render without refetch
let currentMinWeight = 1;     // minimum edge weight (shared terms) to display
let linkMethod       = "tfidf"; // "tfidf" = pre-computed edges; "tags" = Jaccard on tag sets

// ---- WRITE STATE ----
let canEdit    = false;   // true when watch.py's /api/ping is reachable
let writeMode  = false;   // true while the edit/create form is showing
let createMode = false;   // true for create, false for edit
let activeNoteD = null;   // node data object currently open in the side panel

// ---- SVG SETUP ----
const svg    = d3.select("#graph");
const width  = () => svg.node().clientWidth;
const height = () => svg.node().clientHeight;

// g = the zoomable group that contains all graph elements
const g = svg.append("g");

// d3.zoom: enables mouse-wheel zoom and drag-to-pan on the SVG.
// Saved as `zoom` so fitView() can programmatically apply a transform.
const zoom = d3.zoom()
  .scaleExtent([0.1, 8])
  .on("zoom", (event) => g.attr("transform", event.transform));
svg.call(zoom);

// ---- DUAL-MODE API LAYER ----
// The same graph.html file runs in two environments:
//   (1) browser served by watch.py → fetch() over HTTP
//   (2) Tauri desktop window       → window.__TAURI__.core.invoke() over IPC
// `api` is the unified surface every other piece of code calls.
const TAURI    = window.__TAURI__;
const isTauri  = !!TAURI;
const invoke   = isTauri ? TAURI.core.invoke : null;

// CORPUS is meaningful only in Tauri mode; in browser mode the watch.py
// server is already bound to a single corpus and translates /data + /notes paths.
// Hard-coded for Phase 3; network picker comes in Phase 6.
let CORPUS = "../../networks/aurelius";

function throwIfNotOk(r) {
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r;
}

const api = isTauri ? {
  ping:        ()                 => invoke("ping"),
  loadGraph:   ()                 => invoke("get_graph",   { corpus: CORPUS }),
  readNote:    (stem)             => invoke("get_note",    { corpus: CORPUS, stem }),
  updateNote:  (stem, tags, body) => invoke("update_note", { corpus: CORPUS, stem, tags, body }),
  createNote:  (data)             => invoke("create_note", { corpus: CORPUS, ...data }),
  deleteNote:  (stem)             => invoke("delete_note", { corpus: CORPUS, stem }),
  // In Tauri mode Phase 4 will replace polling with a 'graph-updated' event listener.
  graphChangedSince: () => Promise.resolve({ changed: false, marker: null }),
} : {
  ping:        ()                 => fetch("/api/ping").then(throwIfNotOk).then(r => r.json()),
  loadGraph:   ()                 => fetch("../data/graph.json").then(throwIfNotOk).then(r => r.json()),
  readNote:    (stem)             => fetch(`/api/note/${stem}`).then(throwIfNotOk).then(r => r.json()).then(d => d.content),
  updateNote:  (stem, tags, body) => fetch(`/api/note/${stem}`, {
                                       method: "POST",
                                       headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify({ tags, body }),
                                     }).then(throwIfNotOk).then(r => r.json()),
  createNote:  (data)             => fetch("/api/note", {
                                       method: "POST",
                                       headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify(data),
                                     }).then(throwIfNotOk).then(r => r.json()),
  deleteNote:  (stem)             => fetch(`/api/note/${stem}`, { method: "DELETE" })
                                       .then(throwIfNotOk).then(r => r.json()),
  graphChangedSince: (marker)     => fetch("../data/graph.json", { method: "HEAD" })
                                       .then(r => {
                                         const lm = r.headers.get("Last-Modified");
                                         return { changed: lm && lm !== marker, marker: lm };
                                       }),
};

// ---- FETCH + RELOAD ----
let lastModified = null;   // tracks Last-Modified header for change detection (browser mode)

// loadGraph: fetch graph.json and re-render. Preserves node positions across reloads.
function loadGraph(showSpinner = false) {
  const btn = document.getElementById("reload-btn");
  const lbl = document.getElementById("reload-status");
  if (showSpinner) btn.classList.add("spinning");

  // Save current node positions by id so layout survives a reload
  const savedPos = {};
  if (simulation) {
    simulation.nodes().forEach(n => { savedPos[n.id] = { x: n.x, y: n.y }; });
    simulation.stop();
  }

  api.loadGraph()
    .then(data => {
      // In browser mode the HEAD poll uses Last-Modified, but loadGraph
      // returns parsed JSON, so we refresh the marker via a small HEAD probe.
      // In Tauri mode this is a no-op.
      if (!isTauri) {
        fetch("../data/graph.json", { method: "HEAD" })
          .then(r => { lastModified = r.headers.get("Last-Modified"); })
          .catch(() => {});
      }
      return data;
    })
    .then(data => {
      allData = data;
      renderWithDensity(savedPos);
      const ts = new Date().toLocaleTimeString();
      lbl.textContent = `updated ${ts}`;
    })
    .catch(err => {
      g.selectAll("*").remove();
      g.append("text")
        .attr("x", 20).attr("y", 40)
        .attr("fill", "#f06060").attr("font-size", "14px")
        .text(`Could not load graph.json: ${err.message}. Run build_graph.py first.`);
      lbl.textContent = "load failed";
    })
    .finally(() => btn.classList.remove("spinning"));
}

// Auto-poll: HEAD request every 3 s; re-render only if Last-Modified changed.
// HEAD fetches only headers (no body) — very lightweight.
function startPoll() {
  // In Tauri mode this whole loop is a no-op; Phase 4 swaps it for an event listener.
  if (isTauri) return;
  setInterval(() => {
    api.graphChangedSince(lastModified)
      .then(({ changed, marker }) => {
        if (changed) loadGraph();
      })
      .catch(() => {});   // silently ignore poll failures
  }, 3000);
}

// Initial load + start polling + detect write server
loadGraph();
startPoll();
detectWriteServer();

document.getElementById("reload-btn").addEventListener("click", () => loadGraph(true));

// ---- LINK METHOD: TAGS (Jaccard) ----
// Computes edges client-side from node tag sets. Edge weight = number of shared tags;
// edges with weight >= currentMinWeight are shown (same density filter applies).
// Jaccard = |A ∩ B| / |A ∪ B|; we use raw intersection count as weight so the
// existing density buttons (≥1, ≥2 …) work the same way as for TF-IDF.
function computeTagEdges(nodes) {
  const edges = [];
  for (let i = 0; i < nodes.length; i++) {
    const tagsA = nodes[i].tags || [];
    if (!tagsA.length) continue;
    const setA = new Set(tagsA);
    for (let j = i + 1; j < nodes.length; j++) {
      const tagsB = nodes[j].tags || [];
      const shared = tagsB.filter(t => setA.has(t));
      if (shared.length > 0) {
        edges.push({
          from:   nodes[i].id,
          to:     nodes[j].id,
          weight: shared.length,
          terms:  shared.sort(),   // reuses edge tooltip (shows shared tag names)
        });
      }
    }
  }
  return edges;
}

// ---- DENSITY FILTER ----
// Re-renders using the cached allData, filtering edges to weight >= currentMinWeight.
// Recomputes degree centrality on the filtered edge set so node sizes stay accurate.
function renderWithDensity(savedPos = {}) {
  if (!allData) return;

  const baseEdges = linkMethod === "tags"
    ? computeTagEdges(allData.nodes)
    : allData.edges;
  const filteredEdges = baseEdges.filter(e => e.weight >= currentMinWeight);

  // Recount degree from filtered edges (original degrees are for the full set)
  const degree = {};
  filteredEdges.forEach(e => {
    degree[e.from] = (degree[e.from] || 0) + 1;
    degree[e.to]   = (degree[e.to]   || 0) + 1;
  });
  const filteredNodes = allData.nodes.map(n => ({ ...n, degree: degree[n.id] || 0 }));

  g.selectAll("*").remove();
  buildGraph({ nodes: filteredNodes, edges: filteredEdges }, savedPos);
  if (currentLayout === "force" || currentLayout === "force-atlas") {
    runSimFor(SIM_RUN_MS);
  } else {
    applyLayout(currentLayout);
  }

  // Update edge count badge and active button highlight
  document.getElementById("density-count").textContent = `${filteredEdges.length} edges`;
  document.querySelectorAll(".density-btn").forEach(btn => {
    btn.classList.toggle("active", parseInt(btn.dataset.min) === currentMinWeight);
  });
}

document.querySelectorAll(".density-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentMinWeight = parseInt(btn.dataset.min);
    const savedPos = {};
    if (simulation) {
      simulation.nodes().forEach(n => { savedPos[n.id] = { x: n.x, y: n.y }; });
      simulation.stop();
    }
    renderWithDensity(savedPos);
  });
});

document.querySelectorAll(".link-method-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.dataset.method === linkMethod) return;
    linkMethod = btn.dataset.method;
    document.querySelectorAll(".link-method-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.method === linkMethod));
    // Reset density to "All" when switching methods — edge weights differ by method
    currentMinWeight = 1;
    document.querySelectorAll(".density-btn").forEach(b =>
      b.classList.toggle("active", parseInt(b.dataset.min) === 1));
    renderWithDensity();
  });
});

// ---- GRAPH BUILD ----
function buildGraph(data, savedPos = {}) {
  const nodes = data.nodes.map(d => {
    // Restore saved position if this node existed before; prevents full layout reset
    const pos = savedPos[d.id];
    return pos ? { ...d, x: pos.x, y: pos.y } : { ...d };
  });
  // d3.forceLink requires source/target; our JSON uses from/to (note-networks convention)
  const links = data.edges.map(d => ({ ...d, source: d.from, target: d.to }));
  currentLinks = links;  // stored for layouts that need topology (e.g. Kamada-Kawai)

  // ---- FORCE SIMULATION ----
  // Fruchterman–Reingold physics mapped to Gephi's parameters:
  //   Repulsion → forceManyBody (negative strength = nodes repel each other)
  //   Gravity   → forceRadial(0) — pulls each node toward center proportional to distance
  //               (unlike forceCenter which only corrects center-of-mass drift)
  //   forceCenter with low strength keeps the cluster from floating off canvas
  //   forceCollide prevents node overlap (not in FR original, but helps readability)
  // Stop the previous simulation before replacing it — d3.forceSimulation starts
  // its internal rAF timer immediately, so the old timer keeps running if we just
  // overwrite the variable without stopping it.
  if (simulation) simulation.stop();
  simulation = d3.forceSimulation(nodes)
    .force("charge",  d3.forceManyBody().strength(-currentParams.repulsion))
    .force("link",    d3.forceLink(links).id(d => d.id).distance(LINK_DIST))
    .force("center",  d3.forceCenter(width() / 2, height() / 2).strength(0.05))
    .force("gravity", d3.forceRadial(0, width() / 2, height() / 2).strength(currentParams.gravity))
    .force("collide", d3.forceCollide(d => nodeRadius(d) + 4))
    .velocityDecay(VELOCITY_DECAY)
    .on("tick", ticked)
    .stop();  // don't auto-run; force layouts call restart() explicitly via runSimFor()

  // ---- LINKS ----
  linkSel = g.append("g").attr("class", "links")
    .selectAll("line")
    .data(links)
    .join("line")
      .attr("class", "link")
      // Edge thickness scales with shared-term weight
      .attr("stroke-width", d => Math.max(1, Math.sqrt(d.weight)))
      .on("mouseover", showEdgeTip)
      .on("mousemove", moveEdgeTip)
      .on("mouseout",  hideEdgeTip);

  // ---- NODES ----
  nodeSel = g.append("g").attr("class", "nodes")
    .selectAll("g")
    .data(nodes)
    .join("g")
      .attr("class", "node")
      .call(d3.drag()
        .on("start", dragStart)
        .on("drag",  dragged)
        .on("end",   dragEnd))
      .on("click", nodeClick);

  nodeSel.append("circle")
    .attr("r",    d => nodeRadius(d))
    // Node colour keyed on speaker field (categorical)
    .attr("fill", d => color(d.speaker || "UNKNOWN"))
    .attr("stroke", d => d3.color(color(d.speaker || "UNKNOWN")).darker(0.8));

  nodeSel.append("text")
    .text(d => shortLabel(d));

  buildNoteList(nodes);
}

// ---- NOTE LIST ----
let listNodes = [];   // last node set passed to buildNoteList
let sortBy    = "chron";
let sortAsc   = true;

// buildNoteList: store nodes and render. Called from buildGraph on every graph change.
function buildNoteList(nodes) {
  listNodes = nodes;
  renderNoteList();
}

// renderNoteList: sort and redraw items using current sortBy / sortAsc state.
function renderNoteList() {
  const list  = document.getElementById("note-list");
  const count = document.getElementById("note-list-count");
  list.querySelectorAll(".note-item").forEach(el => el.remove());
  count.textContent = `Notes (${listNodes.length})`;

  const comparators = {
    chron: (a, b) => a.id.localeCompare(b.id),
    title: (a, b) => shortLabel(a).localeCompare(shortLabel(b), undefined, { numeric: true }),
    links: (a, b) => (b.degree || 0) - (a.degree || 0),
  };
  const sorted = [...listNodes].sort(comparators[sortBy] || comparators.chron);
  if (!sortAsc) sorted.reverse();

  sorted.forEach(d => {
    const item = document.createElement("div");
    item.className     = "note-item";
    item.dataset.id    = d.id;
    item.dataset.label = shortLabel(d).toLowerCase();

    const dot = document.createElement("span");
    dot.className = "note-item-dot";
    dot.style.background = color(d.speaker || "UNKNOWN");

    const label = document.createElement("span");
    label.className   = "note-item-label";
    label.textContent = shortLabel(d);

    item.appendChild(dot);
    item.appendChild(label);
    item.addEventListener("click", () => noteListClick(d));
    list.appendChild(item);
  });
}

document.getElementById("sort-select").addEventListener("change", function() {
  sortBy = this.value;
  renderNoteList();
});

document.getElementById("sort-dir").addEventListener("click", function() {
  sortAsc = !sortAsc;
  this.textContent = sortAsc ? "↑" : "↓";
  renderNoteList();
});

// Mark one list item as active; clear the rest.
function noteListActivate(id) {
  document.querySelectorAll(".note-item").forEach(el => {
    el.classList.toggle("active", el.dataset.id === id);
  });
}

// Clicking a list item replicates nodeClick: highlights graph + opens side panel.
function noteListClick(d) {
  stopSim();
  if (nodeSel && linkSel) {
    const neighbourIds = new Set(
      linkSel.data()
        .filter(l => l.source.id === d.id || l.target.id === d.id)
        .flatMap(l => [l.source.id, l.target.id])
    );
    nodeSel.classed("dimmed",      n => !neighbourIds.has(n.id) && n.id !== d.id);
    nodeSel.classed("highlighted", n => n.id === d.id);
    linkSel.classed("dimmed",      l => l.source.id !== d.id && l.target.id !== d.id);
    linkSel.classed("highlighted", l => l.source.id === d.id || l.target.id === d.id);
  }
  showPanel(d);
  noteListActivate(d.id);
}

// ---- NODE RADIUS ---- scales with degree centrality (number of edges)
// degree = graph-structural importance; largest node = most-connected hub
function nodeRadius(d) {
  const deg = d.degree || 1;
  return Math.max(6, Math.min(28, 5 + Math.sqrt(deg) * 3.5));
}

// Roman numeral strings for book numbers 1–12.
const INT_TO_ROMAN = ["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];

function shortLabel(d) {
  // Meditations: "med-04-021" → "IV.21 · nature"
  const mm = d.id.match(/^med-0*(\d+)-0*(\d+)/);
  if (mm) {
    const roman = INT_TO_ROMAN[parseInt(mm[1])] || mm[1];
    const base  = `${roman}.${parseInt(mm[2])}`;
    // d.tags is an array on the node object (loaded from graph.json metadata)
    const tag   = d.tags && d.tags[0];
    return tag ? `${base} · ${tag}` : base;
  }
  return d.id;
}

// ---- SIMULATION TICK ---- updates DOM positions each physics step
function ticked() {
  linkSel
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);

  nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
}

// ---- DRAG HANDLERS ----
// dragMoved tracks whether the pointer actually moved during the gesture.
// A bare click fires start→end with no drag events; we must not reheat the
// simulation or release fx/fy in that case, or the node flies off.
let dragMoved = false;

function dragStart(event, d) {
  dragMoved = false;
  // Do NOT reheat yet — wait for the first drag move to confirm intent.
}
function dragged(event, d) {
  if (!dragMoved) {
    // First actual movement: fix position and reheat simulation.
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x; d.fy = d.y;
    dragMoved = true;
  }
  d.fx = event.x; d.fy = event.y;
}
function dragEnd(event, d) {
  if (!dragMoved) return;   // pure click — leave node and simulation untouched
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;  // release fixed position; node drifts again
}

// ---- HTML ESCAPING ----
// Note fields (id, tags, speaker…) come from user-editable files.  Before putting
// them into innerHTML, replace the characters HTML treats as markup with entities,
// so a note named `<img onerror=…>` shows as text instead of running as script.
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

// ---- EDGE TOOLTIP ----
const tip = document.getElementById("tooltip");

function showEdgeTip(event, d) {
  const terms    = (d.terms || []).join(", ") || "(no terms)";
  const isSim    = terms.includes("similar");
  const termLabel = isSim ? "Similarity" : "Shared terms";
  tip.innerHTML = `<strong>${esc(d.source.id)} ↔ ${esc(d.target.id)}</strong><br>
    ${termLabel}: ${esc(terms)}`;
  tip.style.display = "block";
  moveEdgeTip(event);
}
function moveEdgeTip(event) {
  tip.style.left = (event.clientX + 14) + "px";
  tip.style.top  = (event.clientY - 10) + "px";
}
function hideEdgeTip() { tip.style.display = "none"; }

// ---- NODE CLICK → SIDE PANEL ----
function nodeClick(event, d) {
  event.stopPropagation();
  stopSim();

  // Highlight clicked node and its neighbours
  const neighbourIds = new Set(
    (linkSel.data()
      .filter(l => l.source.id === d.id || l.target.id === d.id)
      .flatMap(l => [l.source.id, l.target.id])
    )
  );
  nodeSel.classed("dimmed",      n => !neighbourIds.has(n.id) && n.id !== d.id);
  nodeSel.classed("highlighted", n => n.id === d.id);
  linkSel.classed("dimmed",      l => l.source.id !== d.id && l.target.id !== d.id);
  linkSel.classed("highlighted", l => l.source.id === d.id || l.target.id === d.id);

  showPanel(d);
  noteListActivate(d.id);
}

// Clear highlighting when clicking empty canvas
svg.on("click", () => {
  nodeSel?.classed("dimmed highlighted", false);
  linkSel?.classed("dimmed highlighted", false);
  closePanel();
});

// ---- SIDE PANEL ----
const panel     = document.getElementById("side-panel");
const panelMeta = document.getElementById("panel-meta");
const panelBody = document.getElementById("panel-body");
const panelErr  = document.getElementById("panel-error");
document.getElementById("panel-close").onclick = () => {
  if (writeMode) exitWriteMode();
  closePanel();
  nodeSel?.classed("dimmed highlighted", false);
  linkSel?.classed("dimmed highlighted", false);
};

function closePanel() {
  if (writeMode) exitWriteMode();
  activeNoteD = null;
  panel.classList.add("hidden");
  document.querySelectorAll(".note-item").forEach(el => el.classList.remove("active"));
}

function showPanel(d) {
  activeNoteD = d;
  panel.classList.remove("hidden");
  panelErr.textContent = "";
  panelBody.textContent = "Loading…";

  // Show edit button only when write server is available
  document.getElementById("edit-note-btn").style.display = canEdit ? "block" : "none";

  // Ensure read view is visible
  document.getElementById("read-view").classList.remove("hidden");
  document.getElementById("write-view").classList.add("hidden");
  writeMode = false;

  // Render frontmatter fields
  const tags = Array.isArray(d.tags) ? d.tags.join(", ") : (d.tags || "");
  panelMeta.innerHTML = `
    <strong>${esc(d.id)}</strong><br>
    Speaker: <strong>${esc(d.speaker || "—")}</strong><br>
    Source: ${esc(d.source || d.episode || "—")}<br>
    Words: ${esc(d.word_count || "—")} &nbsp;·&nbsp; Connections: ${esc(d.degree || 0)}<br>
    Tags: ${esc(tags || "—")}
  `;

  fetchNoteBody(d.id);
}

// ---- WRITE / EDIT FUNCTIONALITY ----
// Progressive enhancement: write controls are invisible unless watch.py is running.
// detectWriteServer pings /api/ping on load; 200 → canEdit = true.
async function detectWriteServer() {
  // In Tauri mode the IPC channel is always available, so write controls are always on.
  if (isTauri) {
    canEdit = true;
    document.getElementById("create-note-btn").style.display = "block";
    return;
  }
  try {
    const r = await fetch("/api/ping", { signal: AbortSignal.timeout(1000) });
    if (r.ok) {
      canEdit = true;
      document.getElementById("create-note-btn").style.display = "block";
    }
  } catch (_) {
    // File:// or static host — read-only mode
  }
}

function enterEditMode() {
  if (!canEdit || !activeNoteD) return;
  createMode = false;
  writeMode  = true;

  api.readNote(activeNoteD.id)
    .then(raw => {
      // Strip frontmatter — only body goes in the textarea
      const body = (raw || "").replace(/^---\n[\s\S]*?\n---\n\n?/, "");
      const tags = Array.isArray(activeNoteD.tags) ? activeNoteD.tags.join(", ") : "";
      document.getElementById("form-tags").value   = tags;
      document.getElementById("form-body").value   = body;
      document.getElementById("create-fields").classList.add("hidden");
      document.getElementById("delete-row").classList.remove("hidden");
      document.getElementById("form-status").textContent = "";
      document.getElementById("read-view").classList.add("hidden");
      document.getElementById("write-view").classList.remove("hidden");
    })
    .catch(err => {
      panelErr.textContent = `Could not load note for editing: ${err.message}`;
      writeMode = false;
    });
}

function enterCreateMode() {
  createMode = true;
  writeMode  = true;
  activeNoteD = null;

  panel.classList.remove("hidden");
  document.getElementById("edit-note-btn").style.display = "none";
  document.getElementById("create-fields").classList.remove("hidden");
  document.getElementById("delete-row").classList.add("hidden");
  document.getElementById("form-id").value     = "";
  document.getElementById("form-tags").value   = "";
  document.getElementById("form-body").value   = "";
  document.getElementById("form-status").textContent = "";
  document.getElementById("read-view").classList.add("hidden");
  document.getElementById("write-view").classList.remove("hidden");
  document.getElementById("form-id").focus();
}

function exitWriteMode() {
  writeMode = false;
  document.getElementById("write-view").classList.add("hidden");
  document.getElementById("delete-row").classList.add("hidden");
  document.getElementById("read-view").classList.remove("hidden");
  if (canEdit && activeNoteD) {
    document.getElementById("edit-note-btn").style.display = "block";
  }
}

async function saveNote(event) {
  event.preventDefault();
  const statusEl = document.getElementById("form-status");
  statusEl.textContent = "Saving…";

  const tagsRaw = document.getElementById("form-tags").value;
  const tags    = tagsRaw.split(",").map(t => t.trim()).filter(Boolean);
  const body    = document.getElementById("form-body").value;

  if (createMode) {
    const noteId = document.getElementById("form-id").value.trim();
    if (!noteId) { statusEl.textContent = "Note ID is required."; return; }
    try {
      await api.createNote({ id: noteId, tags, body });
      statusEl.textContent = "Created! Graph will rebuild shortly.";
      // File watcher handles rebuild; close panel after a moment
      setTimeout(() => { exitWriteMode(); closePanel(); }, 1800);
    } catch (err) {
      statusEl.textContent = `Save failed: ${err.message || err}`;
    }
  } else {
    try {
      await api.updateNote(activeNoteD.id, tags, body);
      statusEl.textContent = "Saved! Graph will rebuild shortly.";
      // Update the live panel without waiting for graph reload
      setTimeout(() => {
        exitWriteMode();
        panelBody.textContent = body;
        // Function form of replace(): the returned text is used literally
        // (a string replacement would interpret `$&`, `$1`… inside tags).
        panelMeta.innerHTML = panelMeta.innerHTML.replace(
          /Tags: .*/, () => `Tags: ${esc(tags.join(", ") || "—")}`
        );
      }, 800);
    } catch (err) {
      statusEl.textContent = `Save failed: ${err.message || err}`;
    }
  }
}

async function deleteNote() {
  if (!activeNoteD) return;
  if (!confirm(`Delete "${activeNoteD.id}"? This cannot be undone.`)) return;
  const statusEl = document.getElementById("form-status");
  statusEl.textContent = "Deleting…";
  try {
    await api.deleteNote(activeNoteD.id);
    exitWriteMode();
    closePanel();
  } catch (err) {
    statusEl.textContent = `Delete failed: ${err.message || err}`;
  }
}

async function fetchNoteBody(noteId) {
  // Optional cache: if a future build embeds bodies in graph.json, prefer that.
  const node = simulation ? simulation.nodes().find(n => n.id === noteId) : null;
  if (node && node._body) {
    panelBody.textContent = node._body;
    return;
  }

  // file:// with no Tauri = no way to read the file
  if (!isTauri && window.location.protocol === "file:") {
    document.getElementById("file-warning").style.display = "block";
    panelBody.textContent = "";
    panelErr.textContent  = "Run via localhost or the desktop app to read note bodies.";
    return;
  }

  try {
    const raw = await api.readNote(noteId);
    // Strip YAML frontmatter before displaying
    panelBody.textContent = (raw || "").replace(/^---\n[\s\S]*?\n---\n\n?/, "");
  } catch (err) {
    panelBody.textContent = "";
    panelErr.textContent  = `Could not load note: ${err.message || err}`;
  }
}

// ---- SEARCH ----
// Filters both the graph nodes and the note list simultaneously.
document.getElementById("search").addEventListener("input", function() {
  const q = this.value.trim().toLowerCase();

  // Graph highlight
  if (nodeSel) {
    if (!q) {
      nodeSel.classed("dimmed highlighted", false);
      linkSel.classed("dimmed highlighted", false);
    } else {
      nodeSel.classed("dimmed",      d => !d.id.toLowerCase().includes(q) && !shortLabel(d).toLowerCase().includes(q));
      nodeSel.classed("highlighted", d =>  d.id.toLowerCase().includes(q) ||  shortLabel(d).toLowerCase().includes(q));
      linkSel.classed("dimmed", true);
    }
  }

  // Note list — hide items that don't match label or id
  document.querySelectorAll(".note-item").forEach(el => {
    const match = !q || el.dataset.id.includes(q) || el.dataset.label.includes(q);
    el.style.display = match ? "" : "none";
  });
});

// ---- FR SLIDERS ----
function bindSlider(sliderId, labelId, paramKey, fmt) {
  const sl  = document.getElementById(sliderId);
  const lbl = document.getElementById(labelId);

  sl.addEventListener("input", () => {
    const v = parseFloat(sl.value);
    lbl.textContent = fmt(v);
    currentParams[paramKey] = v;
    applyParams();

}

function applyParams() {
  if (!simulation) return;
  if (currentLayout === "force-atlas") {
    simulation.force("charge").strength(d => -currentParams.repulsion * Math.sqrt(1 + (d.degree || 0)));
  } else {
    simulation.force("charge").strength(-currentParams.repulsion);
  }
  simulation.force("gravity").strength(currentParams.gravity);
  simulation.alpha(0.5);
  runSimFor(SIM_RUN_MS);
}

// ---- CENTER / FIT VIEW ----
// Computes the bounding box of all node positions and zooms to fit.
// Uses the saved `zoom` object to apply a d3.zoomIdentity transform.
function fitView() {
  if (!simulation) return;
  const nodes = simulation.nodes();
  if (!nodes.length) return;
  const pad = 50;
  // Preset layouts store final positions in fx/fy; physics layouts use x/y
  const xs = nodes.map(n => n.fx ?? n.x);
  const ys = nodes.map(n => n.fy ?? n.y);
  const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad;
  const y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  const w = width(), h = height();
  const scale = Math.min(w / (x1 - x0), h / (y1 - y0), 3);
  const tx = (w - scale * (x0 + x1)) / 2;
  const ty = (h - scale * (y0 + y1)) / 2;
  svg.transition().duration(500)
    .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}
document.getElementById("center-btn").addEventListener("click", fitView);

// ============================================================
// ---- LAYOUT SYSTEM ----
// ============================================================

// applyPresetLayout: animate nodes from their current positions to new (x, y).
// positions = [{id, x, y}, ...]. Sets d.fx/d.fy so physics doesn't override.
function applyPresetLayout(positions) {
  simulation.stop();
  const posMap = Object.fromEntries(positions.map(p => [p.id, p]));
  simulation.nodes().forEach(d => {
    const p = posMap[d.id];
    if (!p) return;
    d.fx = p.x; d.fy = p.y;
  });
  // Smooth animated transition to new positions (700 ms ease-cubic)
  nodeSel.transition().duration(700).ease(d3.easeCubicInOut)
    .attr("transform", d => `translate(${d.fx ?? d.x},${d.fy ?? d.y})`);
  linkSel.transition().duration(700).ease(d3.easeCubicInOut)
    .attr("x1", d => d.source.fx ?? d.source.x)
    .attr("y1", d => d.source.fy ?? d.source.y)
    .attr("x2", d => d.target.fx ?? d.target.x)
    .attr("y2", d => d.target.fy ?? d.target.y);
}

function applyLayout(name) {
  currentLayout = name;
  document.getElementById("layout-select").value = name;
  ({
    "force":       layoutForce,
    "force-atlas": layoutForceAtlas,
    "kk":          layoutKK,
    "circular":    layoutCircular,
    "concentric":  layoutConcentric,
    "radial":      layoutRadial,
    "grid":        layoutGrid,
    "clustered":   layoutClustered,
    "spectral":    layoutSpectral,
    "spiral":      layoutSpiral,
    "linear":      layoutLinear,
    "random":      layoutRandom,
  }[name] ?? layoutForce)();
}

document.getElementById("layout-select").addEventListener("change", function() {
  applyLayout(this.value);
});

// ---- 1. FORCE (Fruchterman-Reingold) ----
function layoutForce() {
  simulation.nodes().forEach(d => { d.fx = null; d.fy = null; });
  simulation.force("charge").strength(-currentParams.repulsion);
  simulation.force("link").distance(LINK_DIST).strength(0.5);
  simulation.alphaDecay(0.0228).alpha(0.8);
  runSimFor(SIM_RUN_MS);
}

// ---- 1b. FORCE ATLAS ----
// Key difference from FR: repulsion scales with sqrt(1 + degree), so hub nodes
// push apart more strongly. This separates dense communities from sparse ones.
// Uses forceRadial gravity and slower cooling for longer, more expressive settling.
function layoutForceAtlas() {
  simulation.nodes().forEach(d => { d.fx = null; d.fy = null; });
  simulation.force("charge").strength(d => -currentParams.repulsion * Math.sqrt(1 + (d.degree || 0)));
  // Shorter link distance and degree-weighted spring strength: hubs stay loosely connected
  simulation.force("link").distance(30)
    .strength(d => 1 / Math.min((d.source.degree || 1), (d.target.degree || 1)));
  simulation.force("gravity").strength(currentParams.gravity);
  simulation.alphaDecay(0.01).alpha(1);
  runSimFor(SIM_RUN_MS * 2);  // FA2 runs twice as long — slow decay needs more time
}

// ---- 2. CIRCULAR ----
// Nodes evenly spaced on a single ring, sorted descending by degree (hub at top)
function layoutCircular() {
  const nodes = [...simulation.nodes()].sort((a, b) => b.degree - a.degree);
  const cx = width() / 2, cy = height() / 2;
  const r  = Math.min(width(), height()) * 0.38;
  applyPresetLayout(nodes.map((d, i) => {
    const angle = (2 * Math.PI * i / nodes.length) - Math.PI / 2;
    return { id: d.id, x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
  }));
}

// ---- 3. CONCENTRIC ----
// Three nested rings: top-20% degree (inner), mid-40% (middle), rest (outer)
function layoutConcentric() {
  const nodes = [...simulation.nodes()].sort((a, b) => b.degree - a.degree);
  const cx = width() / 2, cy = height() / 2;
  const minD = Math.min(width(), height());
  const radii = [0.14, 0.27, 0.41].map(f => f * minD); // ring radii
  const n = nodes.length;
  const cuts = [Math.ceil(n * 0.2), Math.ceil(n * 0.55), n]; // ring sizes
  const positions = [];
  let start = 0;
  radii.forEach((r, ri) => {
    const group = nodes.slice(start, cuts[ri]);
    group.forEach((d, i) => {
      const angle = (2 * Math.PI * i / group.length) - Math.PI / 2;
      positions.push({ id: d.id, x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) });
    });
    start = cuts[ri];
  });
  applyPresetLayout(positions);
}

// ---- 4. RADIAL ----
// Distance from center inversely proportional to degree — hubs cluster at core
function layoutRadial() {
  const nodes = simulation.nodes();
  const cx = width() / 2, cy = height() / 2;
  const maxDeg = Math.max(...nodes.map(d => d.degree || 1));
  const maxR   = Math.min(width(), height()) * 0.43;
  applyPresetLayout(nodes.map((d, i) => {
    const r     = maxR * (1 - (d.degree || 1) / (maxDeg + 1));
    const angle = (2 * Math.PI * i / nodes.length);
    return { id: d.id, x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
  }));
}

// ---- 5. GRID ----
// Rectangular grid, high-degree nodes top-left, reading order
function layoutGrid() {
  const nodes = [...simulation.nodes()].sort((a, b) => b.degree - a.degree);
  const cols  = Math.ceil(Math.sqrt(nodes.length));
  const cellW = Math.min(width()  * 0.85, 800) / cols;
  const cellH = Math.min(height() * 0.85, 600) / Math.ceil(nodes.length / cols);
  const offX  = (width()  - cols * cellW) / 2 + cellW / 2;
  const offY  = (height() - Math.ceil(nodes.length / cols) * cellH) / 2 + cellH / 2;
  applyPresetLayout(nodes.map((d, i) => ({
    id: d.id,
    x:  offX + (i % cols) * cellW,
    y:  offY + Math.floor(i / cols) * cellH,
  })));
}

// ---- 6. CLUSTERED ----
// One mini-circle per speaker; cluster centres arranged in a larger circle
function layoutClustered() {
  const nodes = simulation.nodes();
  const groups = {};
  nodes.forEach(d => { (groups[d.speaker] ??= []).push(d); });
  const speakers = Object.keys(groups);
  const cx = width() / 2, cy = height() / 2;
  const outerR  = Math.min(width(), height()) * 0.32;
  const innerR  = Math.min(width(), height()) * 0.07;
  const positions = [];
  speakers.forEach((spk, si) => {
    const clusterAngle = (2 * Math.PI * si / speakers.length) - Math.PI / 2;
    const gcx = cx + outerR * Math.cos(clusterAngle);
    const gcy = cy + outerR * Math.sin(clusterAngle);
    const members = groups[spk];
    members.forEach((d, i) => {
      const a = members.length === 1 ? 0 : (2 * Math.PI * i / members.length);
      positions.push({ id: d.id, x: gcx + innerR * Math.cos(a), y: gcy + innerR * Math.sin(a) });
    });
  });
  applyPresetLayout(positions);
}

// ---- 7. KAMADA-KAWAI ----
// Stress minimization: nodes placed so visual distance ≈ graph-theoretic distance.
// Uses BFS for shortest paths, then Newton gradient descent to minimize energy.
// Reference: Kamada & Kawai, "An Algorithm for Drawing General Undirected Graphs" (1989)
function layoutKK() {
  const nodes = simulation.nodes();
  const n = nodes.length;
  const idToIdx = Object.fromEntries(nodes.map((d, i) => [d.id, i]));

  // BFS shortest paths between all pairs
  const adj = Array.from({ length: n }, () => []);
  currentLinks.forEach(l => {
    const s = idToIdx[l.source.id ?? l.source];
    const t = idToIdx[l.target.id ?? l.target];
    if (s !== undefined && t !== undefined) { adj[s].push(t); adj[t].push(s); }
  });
  const dist = Array.from({ length: n }, (_, i) => {
    const d = new Array(n).fill(Infinity); d[i] = 0;
    const q = [i];
    for (let qi = 0; qi < q.length; qi++) {
      const u = q[qi];
      adj[u].forEach(v => { if (d[v] === Infinity) { d[v] = d[u] + 1; q.push(v); } });
    }
    return d;
  });

  // Replace Infinity (disconnected nodes) with max finite dist + 1
  const maxD = Math.max(...dist.flat().filter(isFinite));
  dist.forEach(row => row.forEach((v, j, arr) => { if (!isFinite(v)) arr[j] = maxD + 1; }));

  // Scale factor L: fill most of the canvas
  const L = Math.min(width(), height()) * 0.7 / (maxD || 1);
  const K = 1; // global spring constant

  // Initial positions: circular (stable start)
  const cx = width() / 2, cy = height() / 2, r0 = L * maxD * 0.4;
  const pos = nodes.map((_, i) => ({
    x: cx + r0 * Math.cos(2 * Math.PI * i / n),
    y: cy + r0 * Math.sin(2 * Math.PI * i / n),
  }));

  // KK energy minimization: 50 outer iterations
  for (let iter = 0; iter < 50; iter++) {
    // Find node m with largest gradient magnitude |ΔE_m|
    let maxGrad = -1, m = 0;
    for (let i = 0; i < n; i++) {
      let dx = 0, dy = 0;
      for (let j = 0; j < n; j++) {
        if (i === j) continue;
        const dij  = dist[i][j] * L;
        const kij  = K / (dist[i][j] * dist[i][j]);
        const ddx  = pos[i].x - pos[j].x;
        const ddy  = pos[i].y - pos[j].y;
        const norm = Math.sqrt(ddx * ddx + ddy * ddy) || 0.001;
        dx += kij * (ddx - dij * ddx / norm);
        dy += kij * (ddy - dij * ddy / norm);
      }
      const grad = Math.sqrt(dx * dx + dy * dy);
      if (grad > maxGrad) { maxGrad = grad; m = i; }
    }
    if (maxGrad < 0.01) break;

    // Newton step for node m: solve 2×2 system Hm * Δ = -∇Em
    for (let sub = 0; sub < 5; sub++) {
      let dEx = 0, dEy = 0, dExx = 0, dEyy = 0, dExy = 0;
      for (let j = 0; j < n; j++) {
        if (j === m) continue;
        const dij  = dist[m][j] * L;
        const kij  = K / (dist[m][j] * dist[m][j]);
        const ddx  = pos[m].x - pos[j].x;
        const ddy  = pos[m].y - pos[j].y;
        const norm = Math.sqrt(ddx * ddx + ddy * ddy) || 0.001;
        const norm3 = norm * norm * norm;
        dEx  += kij * (ddx - dij * ddx / norm);
        dEy  += kij * (ddy - dij * ddy / norm);
        dExx += kij * (1 - dij * ddy * ddy / norm3);
        dEyy += kij * (1 - dij * ddx * ddx / norm3);
        dExy += kij * (dij * ddx * ddy / norm3);
      }
      // 2×2 Cramer's rule: [dExx dExy] [Δx] = [-dEx]
      //                    [dExy dEyy] [Δy]   [-dEy]
      const det = dExx * dEyy - dExy * dExy;
      if (Math.abs(det) < 1e-10) break;
      pos[m].x -= (dEyy * dEx - dExy * dEy) / det;
      pos[m].y -= (dExx * dEy - dExy * dEx) / det;
    }
  }
  applyPresetLayout(nodes.map((d, i) => ({ id: d.id, x: pos[i].x, y: pos[i].y })));
}

// ---- 8. SPECTRAL ----
// Uses the 2nd and 3rd eigenvectors (Fiedler vectors) of the graph Laplacian.
// Nodes connected by many edges appear close together; disconnected ones far apart.
// Computed via Jacobi eigenvalue algorithm on the symmetric Laplacian matrix.
function layoutSpectral() {
  const nodes = simulation.nodes();
  const n = nodes.length;
  const idToIdx = Object.fromEntries(nodes.map((d, i) => [d.id, i]));

  // Build Laplacian L = D - A  (D = degree matrix, A = adjacency)
  const L = Array.from({ length: n }, () => new Float64Array(n));
  currentLinks.forEach(link => {
    const i = idToIdx[link.source.id ?? link.source];
    const j = idToIdx[link.target.id ?? link.target];
    if (i === undefined || j === undefined) return;
    L[i][j] -= 1; L[j][i] -= 1;
    L[i][i] += 1; L[j][j] += 1;
  });

  // Jacobi eigenvalue algorithm for symmetric matrices
  // Returns eigenvectors as columns of V; eigenvalues in d
  const V = Array.from({ length: n }, (_, i) =>
    Float64Array.from({ length: n }, (_, j) => i === j ? 1 : 0));
  const A = L.map(r => new Float64Array(r));
  const MAX_ITER = n * n * 5;

  for (let iter = 0; iter < MAX_ITER; iter++) {
    let maxOff = 0, p = 0, q = 1;
    // Find largest off-diagonal element
    for (let i = 0; i < n - 1; i++)
      for (let j = i + 1; j < n; j++)
        if (Math.abs(A[i][j]) > maxOff) { maxOff = Math.abs(A[i][j]); p = i; q = j; }
    if (maxOff < 1e-8) break;
    // Jacobi rotation angle
    const tau = (A[q][q] - A[p][p]) / (2 * A[p][q]);
    const t   = Math.sign(tau) / (Math.abs(tau) + Math.sqrt(1 + tau * tau));
    const c   = 1 / Math.sqrt(1 + t * t), s = t * c;
    // Update A
    const App = A[p][p], Aqq = A[q][q], Apq = A[p][q];
    A[p][p] = c*c*App - 2*s*c*Apq + s*s*Aqq;
    A[q][q] = s*s*App + 2*s*c*Apq + c*c*Aqq;
    A[p][q] = A[q][p] = 0;
    for (let r = 0; r < n; r++) {
      if (r === p || r === q) continue;
      const Arp = A[r][p], Arq = A[r][q];
      A[r][p] = A[p][r] = c*Arp - s*Arq;
      A[r][q] = A[q][r] = s*Arp + c*Arq;
    }
    // Update eigenvectors V
    for (let r = 0; r < n; r++) {
      const Vrp = V[r][p], Vrq = V[r][q];
      V[r][p] = c*Vrp - s*Vrq;
      V[r][q] = s*Vrp + c*Vrq;
    }
  }
  // Sort eigenvectors by eigenvalue (diagonal of A after convergence)
  const eigs = Array.from({ length: n }, (_, i) => ({ val: A[i][i], vec: V.map(r => r[i]) }))
    .sort((a, b) => a.val - b.val);

  // Use 2nd and 3rd eigenvectors as x/y (skip the constant 1st eigenvector)
  const v2 = eigs[1].vec, v3 = eigs[2].vec;
  const scale = Math.min(width(), height()) * 0.4;
  const cx = width() / 2, cy = height() / 2;
  // Normalise to [-1, 1] then scale
  const norm2 = Math.max(...v2.map(Math.abs)) || 1;
  const norm3 = Math.max(...v3.map(Math.abs)) || 1;
  applyPresetLayout(nodes.map((d, i) => ({
    id: d.id,
    x: cx + (v2[i] / norm2) * scale,
    y: cy + (v3[i] / norm3) * scale,
  })));
}

// ---- 9. SPIRAL ----
// Archimedean spiral: r = a + b*θ. Nodes placed by degree rank (highest at centre).
function layoutSpiral() {
  const nodes = [...simulation.nodes()].sort((a, b) => b.degree - a.degree);
  const cx = width() / 2, cy = height() / 2;
  const turns   = 3;
  const maxR    = Math.min(width(), height()) * 0.42;
  applyPresetLayout(nodes.map((d, i) => {
    const t     = i / nodes.length;         // 0..1 along the spiral
    const angle = turns * 2 * Math.PI * t;  // total angle swept
    const r     = maxR * t;
    return { id: d.id, x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
  }));
}

// ---- 10. LINEAR ----
// All nodes on a horizontal line, sorted by degree descending (hub in the centre)
function layoutLinear() {
  const nodes = [...simulation.nodes()].sort((a, b) => b.degree - a.degree);
  const margin = width() * 0.1;
  const step   = (width() - 2 * margin) / Math.max(nodes.length - 1, 1);
  const cy     = height() / 2;
  applyPresetLayout(nodes.map((d, i) => ({
    id: d.id, x: margin + i * step, y: cy,
  })));
}

// ---- 11. RANDOM ----
function layoutRandom() {
  const margin = 60;
  applyPresetLayout(simulation.nodes().map(d => ({
    id: d.id,
    x: margin + Math.random() * (width()  - 2 * margin),
    y: margin + Math.random() * (height() - 2 * margin),
  })));
}

// ---- RESIZE ----
window.addEventListener("resize", () => {
  if (simulation) {
    simulation.force("center").x(width() / 2).y(height() / 2);
    simulation.force("gravity").x(width() / 2).y(height() / 2);
    if (currentLayout === "force" || currentLayout === "force-atlas") {
      simulation.alpha(0.3);
      runSimFor(SIM_RUN_MS);
    }
  }
});
